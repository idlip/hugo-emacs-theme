<script>
(function () {
  'use strict';
  var list = document.getElementById('article-list');
  if (!list) return;

  function groupItems(divider) {
    var items = [];
    var el = divider.nextElementSibling;
    while (el && !el.classList.contains('year-divider')) {
      if (el.classList.contains('article-item')) items.push(el);
      el = el.nextElementSibling;
    }
    return items;
  }

  /* ── section collapse ── */
  list.querySelectorAll('.year-divider').forEach(function (div) {
    var items = groupItems(div);
    if (!items.length) return;

    /* remove decorative-only ARIA — element is now interactive */
    div.removeAttribute('role');
    div.removeAttribute('aria-hidden');
    div.classList.add('collapsible');

    var label = div.querySelector('.year-label');
    /* extract name before moving child nodes */
    var name = label ? label.textContent.trim().replace(/\s*\(\d+\)\s*$/, '').trim() : 'section';

    /* full-width <button> wrapping label content — keyboard-accessible, proper semantics */
    var btn = document.createElement('button');
    btn.className = 'section-toggle-btn';
    btn.setAttribute('aria-expanded', 'true');
    btn.title = 'Click to collapse "' + name + '"';
    if (label) {
      Array.from(label.childNodes).forEach(function (c) { btn.appendChild(c); });
      label.appendChild(btn);
    }

    btn.addEventListener('click', function () {
      var expanded = btn.getAttribute('aria-expanded') === 'true';
      btn.setAttribute('aria-expanded', String(!expanded));
      div.classList.toggle('collapsed', expanded);
      btn.title = expanded
        ? '"' + name + '" is collapsed — click to expand'
        : 'Click to collapse "' + name + '"';

      var inp = document.getElementById('topic-search');
      if (!inp || !inp.value.trim()) {
        items.forEach(function (item) {
          item.dataset.sectionHidden = expanded ? '1' : '';
          item.style.display = expanded ? 'none' : '';
        });
      }
    });
  });

  /* ── search ── */
  var inp   = document.getElementById('topic-search');
  var count = document.getElementById('topic-count');
  if (!inp) return;

  function run(raw) {
    var q = raw.toLowerCase().trim();
    var n = 0;

    list.querySelectorAll('.topic-item[data-title]').forEach(function (el) {
      var ok = !q || (el.dataset.title || '').indexOf(q) !== -1;
      el.dataset.searchHidden = ok ? '' : '1';
      el.style.display = q ? (ok ? '' : 'none') : (el.dataset.sectionHidden ? 'none' : '');
      if (ok) n++;
    });

    list.querySelectorAll('.year-divider').forEach(function (div) {
      var hasVisible = groupItems(div).some(function (el) {
        return el.style.display !== 'none';
      });
      div.style.display = hasVisible ? '' : 'none';
    });

    if (count) count.textContent = q ? (n + ' match' + (n !== 1 ? 'es' : '')) : '';
  }

  inp.addEventListener('input', function () { run(this.value); });

  document.addEventListener('keydown', function (e) {
    if (e.key === '/'
        && document.activeElement !== inp
        && document.activeElement.tagName !== 'INPUT'
        && document.activeElement.tagName !== 'TEXTAREA') {
      e.preventDefault(); inp.focus(); inp.select();
    }
    if (e.key === 'Escape' && document.activeElement === inp) {
      inp.value = ''; run(''); inp.blur();
    }
  });
}());
</script>
